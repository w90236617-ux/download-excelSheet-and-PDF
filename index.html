<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
<style>
    #pdfContent {
    position: fixed;
    left: -9999px;
    top: 0;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f7fb;
    font-family: Arial, sans-serif;
}
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;

    background: #f5f7fb;
    font-family: Arial, sans-serif;
    padding-top: 60px;
}

h1 {
    margin: 0 0 35px 0;
    text-align: center;
    font-size: 38px;
    color: #24324a;
    letter-spacing: 1px;
}

button {
    padding: 14px 30px;
    border: none;
    margin-bottom: 10px;
    border-radius: 14px;
    background: #a8c7fa;
    color: #24324a;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(100, 130, 180, 0.18);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;
}

/* Hover Animation */
button:hover {
    background: #91b8f5;

    transform:
        translateY(-6px)
        scale(1.05);

    box-shadow:
        0 15px 30px rgba(100, 130, 180, 0.28),
        0 0 20px rgba(145, 184, 245, 0.35);
}

/* Click Animation */
button:active {
    transform: translateY(-1px) scale(0.97);
}

/* Smooth shine effect */
button {
    position: relative;
    overflow: hidden;
}

button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;

    background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.5),
        transparent
    );

    transform: skewX(-20deg);
    transition: 0.6s;
}

button:hover::before {
    left: 130%;
}
</style>
     <h1>Filter users</h1>

    <div id="pdfContent"></div>

<button onclick="pdfDownload()">Download PDF</button>


   <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
